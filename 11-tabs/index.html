<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="tabs">

    <div class="tab-buttons">
      <button class="tab active" data-tab="1">Aba 1</button>
      <button class="tab" data-tab="2">Aba 2</button>
      <button class="tab" data-tab="3">Aba 3</button>
    </div>

    <div class="tab-content">

      <div class="content active" data-content="1">
        <p>Conteúdo da aba 1</p>
      </div>
      <div class="content" data-content="2">
        <p>Conteúdo da aba 2</p>
      </div>
      <div class="content" data-content="3">
        <p>Conteúdo da aba 3</p>
      </div>

    </div>

  </div>


  <script src="script.js"></script>
</body>

</html>
