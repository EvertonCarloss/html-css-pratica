<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="accordion">

    <h1>Perguntas Frequentes</h1>

    <div class="item">
      <button class="question">O que é HTML?</button>
      <div class="answer">
        <p>HTML é a linguagem de marcação usada para estruturar páginas web.</p>
      </div>
    </div>

    <div class="item">
      <button class="question">O que é CSS?</button>
      <div class="answer">
        <p>CSS é usado para estilizar elementos HTML.</p>
      </div>
    </div>

    <div class="item">
      <button class="question">O que é Javascript?</button>
      <div class="answer">
        <p>Javascript? adiciona interatividade às páginas.</p>
      </div>
    </div>

  </section>

  <script src="script.js"></script>
</body>

</html>
